name: Browser smoke

on:
  pull_request:
    paths:
      - ".github/workflows/browser-smoke.yml"
      - "package-lock.json"
      - "package.json"
      - "packages/tabula/**"
      - "playwright.config.ts"
      - "scripts/browser-smoke.mjs"
      - "scripts/browser-smoke/**"
      - "tabula-app/**"
      - "tests/browser/**"
      - "vite.config.ts"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Tabula.md
        uses: actions/checkout@v4

      - name: Checkout room relay
        uses: actions/checkout@v4
        with:
          repository: tabula-md/tabula-room
          # Pull requests use the known-compatible relay; scheduled runs test room main.
          ref: ${{ github.event_name == 'pull_request' && '44cc9d5f87b770e7e5097af83aa445c8234950bd' || 'main' }}
          path: tabula-room

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install room dependencies
        run: npm ci
        working-directory: tabula-room

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright pull request canary
        if: github.event_name == 'pull_request'
        run: npm run test:browser:playwright:canary

      - name: Run Playwright extended suite
        if: github.event_name != 'pull_request'
        env:
          TABULA_ROOM_REPO_DIR: ${{ github.workspace }}/tabula-room
        run: npm run test:browser:playwright

      - name: Run pull request canary
        if: github.event_name == 'pull_request'
        env:
          TABULA_ROOM_REPO_DIR: ${{ github.workspace }}/tabula-room
        run: npm run test:browser -- --suite=workspace,collaboration

      - name: Run scheduled suite
        if: github.event_name != 'pull_request'
        env:
          TABULA_ROOM_REPO_DIR: ${{ github.workspace }}/tabula-room
        run: npm run test:browser

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: output/playwright
          if-no-files-found: ignore
          retention-days: 7
